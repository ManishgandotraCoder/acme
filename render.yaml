# Render blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo. Render builds the Dockerfile, provisions
# PostgreSQL and injects its URL; the container migrates, seeds 10k employees on first boot
# and serves UI + API on one URL. Ollama isn't hosted here, so Ask AI answers "unavailable"
# (503) while the rest of the app works (see docs/adr/0005-single-container-deployment.md).
services:
  - type: web
    name: acme-salary
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SALARY_DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString

databases:
  - name: acme-salary-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: salary
    user: salary
