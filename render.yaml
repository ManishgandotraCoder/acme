# Render blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo. Render builds the Dockerfile; the container
# migrates, seeds 10k employees on first boot and serves UI + API on one URL.
#
# Two kinds of settings (all listed in backend/.env.example):
# - Secrets (sync: false): Render asks for them on the first deploy and keeps them in the
#   dashboard. They are never committed.
# - Plain settings (value: ...): committed here, so every deploy is reproducible.
services:
  - type: web
    name: acme-salary
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Same AWS region as the Neon database (us-east-2), so queries don't cross the country.
    region: ohio
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Secrets ---------------------------------------------------------------------
      # Neon PostgreSQL connection string (Neon's free tier doesn't expire, unlike Render's).
      - key: SALARY_DATABASE_URL
        sync: false
      # Ollama isn't hosted here, so the assistant needs a cloud model: set at least one key.
      # Without one, it answers "unavailable" (503) while the rest of the app works.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # --- Plain settings --------------------------------------------------------------
      - key: SALARY_LLM_PROVIDER
        value: anthropic  # or openai, to match the key above
      - key: SALARY_LOG_LEVEL
        value: INFO
