# Local stack. Database only (for `make dev-api`): `make db-up`.
# Everything: `docker compose up --build`, then http://localhost:8000
# Settings come from .env next to this file (see .env.example); each has a default here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salary}
      POSTGRES_DB: ${POSTGRES_DB:-salary}
    ports: ["${POSTGRES_PORT:-5433}:5432"]  # 5433 avoids clashing with a locally installed Postgres
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      # $$ defers to the container's own environment.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports: ["${APP_PORT:-8000}:8000"]
    # Same settings as local development (API keys, model, actor...). Optional: copy
    # backend/.env.example to backend/.env.
    env_file:
      - path: backend/.env
        required: false
    # Inside the container the database and Ollama are other services, not localhost, so
    # these override whatever backend/.env says.
    environment:
      SALARY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-salary}:${POSTGRES_PASSWORD:-salary}@postgres:5432/${POSTGRES_DB:-salary}
      SALARY_OLLAMA_URL: http://ollama:11434
      SALARY_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }
    profiles: [app]

  ollama:
    image: ollama/ollama:0.12.3
    volumes: ["ollama-models:/root/.ollama"]
    # Pull the model once on start-up (the app works without it; Ask AI returns 503 until ready).
    entrypoint: ["sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-llama3.2} && wait"]
    profiles: [app]

volumes:
  postgres-data:
  ollama-models:
